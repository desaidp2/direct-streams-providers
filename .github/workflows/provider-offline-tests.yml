name: Movy and provider offline tests

on:
  pull_request:
    branches:
      - stremio-cinejoy-render
  push:
    branches:
      - movy-seed-diagnostics

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --omit=optional
      - name: Run offline provider tests
        run: npm run test:offline
